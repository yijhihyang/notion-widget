<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>會考倒數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --frame: #F6EEDC;  --card: #FFFFFF;
    --navy:  #1F2D4A;  --gold: #C9A24B;
    --ink:   #3A3F4B;  --muted: #9AA0AB;
    --rose:  #F7D6D9;  --rose-ink:  #C2606C;
    --mint:  #D3EEDF;  --mint-ink:  #3E8E68;
    --lilac: #E4DCF5;  --lilac-ink: #7A62B8;
    --lemon: #FBF0C9;  --sky: #D6E8F7; --sky-ink: #3D6E9E;
    --title: var(--navy);
  }

  /* ===== 深色模式：跟著系統設定，或用 ?theme=dark 強制 ===== */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --frame: #2A2621;  --card: #1E1E1E;
      --title: #F3EAD7;  --gold: #D9B866;
      --ink:   #E6E1D8;  --muted: #8F8A82;
      --rose:  #4A2E33;  --rose-ink:  #F0B4BC;
      --mint:  #263F33;  --mint-ink:  #9FDCBC;
      --lilac: #36304A;  --lilac-ink: #C9BAF0;
      --lemon: #4A4127;  --sky: #26364A; --sky-ink: #A9CCEE;
    }
  }
  :root[data-theme="dark"] {
    --frame: #2A2621;  --card: #1E1E1E;
    --title: #F3EAD7;  --gold: #D9B866;
    --ink:   #E6E1D8;  --muted: #8F8A82;
    --rose:  #4A2E33;  --rose-ink:  #F0B4BC;
    --mint:  #263F33;  --mint-ink:  #9FDCBC;
    --lilac: #36304A;  --lilac-ink: #C9BAF0;
    --lemon: #4A4127;  --sky: #26364A; --sky-ink: #A9CCEE;
  }
  /*
    ===== 等比例縮放 =====
    整個 widget 以 360 × 360 為設計尺寸，--u 代表「1 個設計像素」實際要畫多大。
    取寬、高兩個方向中比較小的比例，所以不管在 Notion 把嵌入框拉大、縮小、拉扁、拉長，
    內容都會完整塞進框內、不會被裁掉；外框顏色則一直填滿整個嵌入區塊。
  */
  :root { --u: min(calc(100vw / 360), calc(100vh / 360)); }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
  }
  .frame {
    width: 100%; height: 100%;
    background: var(--frame);
    padding: calc(16 * var(--u));
    display: flex;
  }
  .card {
    flex: 1;
    background: var(--card);
    border-radius: calc(16 * var(--u));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: calc(16 * var(--u));
  }

  .pill {
    display: inline-block; padding: calc(4 * var(--u)) calc(12 * var(--u)); border-radius: 999px;
    background: var(--lemon); color: var(--title);
    font-size: calc(13 * var(--u)); font-weight: 700; letter-spacing: calc(1 * var(--u));
  }

  .days { margin: calc(14 * var(--u)) 0 calc(4 * var(--u)); line-height: 1; color: var(--title); }
  .days b { font-family: Quicksand, sans-serif; font-weight: 700; font-size: calc(72 * var(--u)); }
  .days span { font-size: calc(18 * var(--u)); font-weight: 700; margin-left: calc(4 * var(--u)); }

  .hms { display: flex; justify-content: center; gap: calc(8 * var(--u)); margin: calc(14 * var(--u)) 0 calc(16 * var(--u)); }
  .unit { width: calc(64 * var(--u)); border-radius: calc(12 * var(--u)); padding: calc(8 * var(--u)) 0 calc(6 * var(--u)); }
  .unit b { display: block; font-family: Quicksand, sans-serif; font-size: calc(22 * var(--u)); font-weight: 700; line-height: 1.1; }
  .unit small { font-size: calc(11 * var(--u)); font-weight: 500; opacity: .85; }
  .u-h { background: var(--rose);  color: var(--rose-ink); }
  .u-m { background: var(--lilac); color: var(--lilac-ink); }
  .u-s { background: var(--mint);  color: var(--mint-ink); }

  .date { font-size: calc(13 * var(--u)); color: var(--muted); }
  .date b { color: var(--ink); font-weight: 500; }

  .weekend {
    margin-top: calc(12 * var(--u)); display: inline-block;
    padding: calc(6 * var(--u)) calc(12 * var(--u)); border-radius: 999px;
    background: var(--sky); color: var(--sky-ink); font-size: calc(12 * var(--u)); font-weight: 500;
  }
  .weekend b { font-family: Quicksand, sans-serif; font-size: calc(15 * var(--u)); margin: 0 calc(2 * var(--u)); }

  .done { font-size: calc(26 * var(--u)); font-weight: 700; color: var(--title); margin: calc(22 * var(--u)) 0 calc(10 * var(--u)); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="frame">
  <div class="card">
    <span class="pill" id="label">會考倒數</span>

    <div id="counting">
      <div class="days"><b id="d">0</b><span>天</span></div>
      <div class="hms" id="hms">
        <div class="unit u-h"><b id="h">00</b><small>時</small></div>
        <div class="unit u-m"><b id="m">00</b><small>分</small></div>
        <div class="unit u-s"><b id="s">00</b><small>秒</small></div>
      </div>
    </div>
    <div class="done" id="done" hidden></div>

    <div class="date" id="dateText"></div>
    <div class="weekend" id="weekend"></div>
  </div>
</div>

<script>
/*
  網址參數（可選）：
  ?date=2027-05-15     考試第一天（預設：116 年會考 2027-05-15，依教育部公文）
  ?days=2              考試天數（預設 2）
  ?name=會考            名稱（預設「會考」）
  ?label=會考倒數   上方標籤文字
  ?seconds=0           不顯示時分秒，只顯示天數
  ?theme=dark / light  強制深色或淺色（預設跟著系統）
*/
const p = new URLSearchParams(location.search);
const START = p.get('date') || '2027-05-15';
const SPAN  = Math.max(1, parseInt(p.get('days') || '2', 10));
const NAME  = p.get('name') || '會考';
const SHOW_HMS = p.get('seconds') !== '0';
if (p.get('theme') === 'dark' || p.get('theme') === 'light') document.documentElement.dataset.theme = p.get('theme');
if (p.get('label')) document.getElementById('label').textContent = p.get('label');
else if (!p.get('date')) document.getElementById('label').textContent = '會考倒數';
else document.getElementById('label').textContent = NAME + '倒數';

const [Y, M, D] = START.split('-').map(Number);
const examStart = new Date(Y, M - 1, D);                 // 第一天 00:00（裝置當地時間）
const examEnd   = new Date(Y, M - 1, D + SPAN);           // 最後一天結束
const WEEK = '日一二三四五六';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

// 考試日期文字：2027.05.15 - 2027.05.16
const dot = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
const last = new Date(Y, M - 1, D + SPAN - 1);
$('dateText').innerHTML = SPAN > 1
  ? `<b>${dot(examStart)} - ${dot(last)}</b>`
  : `<b>${dot(examStart)}</b>`;

if (!SHOW_HMS) $('hms').hidden = true;

// 考前還剩幾個週末（從明天起算，不含考試當週）
function weekendsLeft(now) {
  let n = 0;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  while (d < examStart) {
    if (d.getDay() === 6) n++;
    d.setDate(d.getDate() + 1);
  }
  return n;
}

function tick() {
  const now = new Date();
  if (now >= examStart && now < examEnd) {               // 考試期間
    $('counting').hidden = true; $('weekend').hidden = true;
    $('done').hidden = false; $('done').textContent = `${NAME}加油！`;
    return;
  }
  if (now >= examEnd) {                                   // 考完了
    $('counting').hidden = true; $('weekend').hidden = true;
    $('done').hidden = false; $('done').textContent = '辛苦了！🎉';
    return;
  }
  let ms = examStart - now;
  const d = Math.floor(ms / 864e5); ms -= d * 864e5;
  const h = Math.floor(ms / 36e5);  ms -= h * 36e5;
  const m = Math.floor(ms / 6e4);   ms -= m * 6e4;
  const s = Math.floor(ms / 1e3);
  $('d').textContent = d;
  $('h').textContent = pad(h); $('m').textContent = pad(m); $('s').textContent = pad(s);
  $('weekend').innerHTML = `考前還有 <b>${weekendsLeft(now)}</b> 個週末`;
}
tick();
setInterval(tick, SHOW_HMS ? 1000 : 60000);
</script>
</body>
</html>
