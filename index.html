<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion 桌面時鐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: one centered block that scales with the embed's width; time large, date line beneath, a thin year-progress track at the bottom. */
:root {
  --bg: #ffffff;
  --fg: #37352f;
  --muted: #8a877f;
  --track: #ecebe8;
  --accent: #2f7fbf;
  --font-time: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-text: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919; --fg: #e9e9e7; --muted: #8f8d88; --track: #2c2c2b; --accent: #5aa6e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191919; --fg: #e9e9e7; --muted: #8f8d88; --track: #2c2c2b; --accent: #5aa6e0;
  color-scheme: dark;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-text);
  padding-inline: 16px;
  padding-block: 0;
  display: grid;
  place-items: center;
}
.clock {
  width: 100%;
  max-width: 520px;
  display: grid;
  gap: 0.6rem;
  justify-items: center;
  text-align: center;
  padding-block: 1.25rem;
}
.time {
  font-family: var(--font-time);
  font-weight: 300;
  font-size: clamp(2.6rem, 15vw, 5.5rem);
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: baseline;
  gap: 0.05em;
}
.time .colon { color: var(--muted); transition: opacity .3s; }
.time .sec {
  font-size: 0.36em;
  font-weight: 400;
  color: var(--muted);
  margin-left: 0.35em;
  align-self: flex-end;
  padding-bottom: 0.25em;
}
.date {
  font-size: clamp(0.95rem, 3.6vw, 1.15rem);
  font-weight: 500;
  letter-spacing: 0.04em;
}
.meta {
  font-size: 0.8rem;
  color: var(--muted);
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
}
.year {
  width: min(100%, 280px);
  display: grid;
  gap: 0.35rem;
  margin-top: 0.4rem;
}
.bar { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { .time .colon { transition: none; } }
</style>
</head>
<body>

<main class="clock" aria-live="off">
  <div class="time" id="time" aria-label="目前時間">
    <span id="hh">--</span><span class="colon" id="colon">:</span><span id="mm">--</span><span class="sec" id="ss">--</span>
  </div>
  <div class="date" id="date">—</div>
  <div class="meta" id="meta">—</div>
  <div class="year">
    <div class="bar"><span id="yearbar" style="width:0%"></span></div>
    <div class="meta" id="yeartext">—</div>
  </div>
</main>

<script>
(function () {
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  const pad = n => String(n).padStart(2, "0");
  const $ = id => document.getElementById(id);

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }

  function tick() {
    const now = new Date();
    $("hh").textContent = pad(now.getHours());
    $("mm").textContent = pad(now.getMinutes());
    $("ss").textContent = pad(now.getSeconds());
    $("colon").style.opacity = now.getMilliseconds() < 500 ? 1 : 0.35;

    const y = now.getFullYear();
    $("date").textContent = `${y} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日　星期${WEEK[now.getDay()]}`;

    const start = new Date(y, 0, 1);
    const end = new Date(y + 1, 0, 1);
    const dayOfYear = Math.floor((new Date(y, now.getMonth(), now.getDate()) - start) / 86400000) + 1;
    const totalDays = Math.round((end - start) / 86400000);
    $("meta").textContent = `第 ${isoWeek(now)} 週 · 今年第 ${dayOfYear} 天`;

    const pct = ((now - start) / (end - start)) * 100;
    $("yearbar").style.width = pct.toFixed(2) + "%";
    $("yeartext").textContent = `${y} 已過 ${pct.toFixed(1)}%，剩 ${totalDays - dayOfYear} 天`;
  }

  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
